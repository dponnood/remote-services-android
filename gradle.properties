# Keep Gradle in-process on the Windows development host. Forked daemon
# startup is blocked by the host loopback policy; Android Studio can still
# supply its own memory settings when it launches Gradle.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# The requested workspace uses a Chinese folder name. The project is kept
# there intentionally; AGP's Windows path guard is therefore explicitly
# acknowledged for this workspace.
android.overridePathCheck=true
kotlin.code.style=official
