<?xml version="1.0" encoding="UTF-8"?>
<!--
  远程服务 / 06-C 蓝青橙缎带环
  This SVG is the source of truth for the raster preview and the Android
  foreground/monochrome VectorDrawables.  The foreground motif stays inside
  the adaptive-icon safe area (approximately x/y 22..86 in a 108 viewport).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <rect width="108" height="108" rx="24" fill="#0B1633"/>

  <!-- A dark underlay separates the three ribbon passes at small sizes. -->
  <g fill="none" stroke="#07122D" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 34 C47 21 68 22 79 39 C87 51 85 66 76 76"/>
    <path d="M76 76 C67 85 54 89 42 85 C29 81 22 71 22 60 C22 49 27 40 34 34"/>
    <path d="M34 34 C47 27 62 29 71 40 C81 52 78 69 62 85"/>
  </g>

  <!-- Back cyan pass. -->
  <path fill="none" stroke="#29E0E5" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"
        d="M34 34 C47 21 68 22 79 39 C87 51 85 66 76 76"/>
  <!-- Warm front pass. -->
  <path fill="none" stroke="#FF9C20" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"
        d="M76 76 C67 85 54 89 42 85 C29 81 22 71 22 60 C22 49 27 40 34 34"/>
  <!-- Blue crossing pass. -->
  <path fill="none" stroke="#246BFF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"
        d="M34 34 C47 27 62 29 71 40 C81 52 78 69 62 85"/>

  <!-- Restrained highlights preserve the ribbon reading without a bitmap glow. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.56">
    <path d="M38 31 C50 24 65 26 74 39"/>
    <path d="M29 60 C29 51 34 44 41 40"/>
    <path d="M73 45 C78 54 75 66 68 74"/>
  </g>
</svg>
